<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>首创京都期货 - 应用下载</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .logo {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: white;
        }

        h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .status {
            background: #f0f4ff;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #667eea;
        }

        .status.detecting {
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.6;
            }
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            padding: 16px 30px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            color: white;
        }

        .btn-ios {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .btn-ios:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-android {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .btn-android:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(245, 87, 108, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #999;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #667eea;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">📱</div>
        <h1>首创京都期货</h1>
        <p class="subtitle">点击下方按钮下载应用，或等待自动跳转</p>
        
        <div class="status detecting" id="status">
            <span class="spinner"></span>
            <span id="statusText">正在检测您的设备...</span>
        </div>

        <div class="buttons">
            <a href="https://apps.apple.com/app/id1439870586" 
               class="btn btn-ios" 
               id="iosBtn">
                🍎 前往 App Store
            </a>
            <a href="https://www.jingduqh.com/companyfile/10/" 
               class="btn btn-android" 
               id="androidBtn">
                🤖 前往 Android 下载
            </a>
        </div>

        <div class="footer">
            如未自动跳转，请手动点击上方按钮
        </div>
    </div>

    <script>
        // 配置
        const CONFIG = {
            // 使用简化的 App Store 链接（更可靠）
            iosUrl: 'https://apps.apple.com/app/id1439870586',
            // 备用链接（带中文）
            iosUrlFallback: 'https://apps.apple.com/cn/app/%E9%A6%96%E5%88%9B%E4%BA%AC%E9%83%BD%E6%9C%9F%E8%B4%A7/id1439870586',
            androidUrl: 'https://www.jingduqh.com/companyfile/10/',
            autoRedirectDelay: 2000 // 2秒后自动跳转
        };

        // 设备检测
        function detectDevice() {
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
            
            // iOS 检测
            if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                return 'ios';
            }
            
            // Android 检测
            if (/android/i.test(userAgent)) {
                return 'android';
            }
            
            // 微信内置浏览器检测
            if (/MicroMessenger/i.test(userAgent)) {
                if (/android/i.test(userAgent)) {
                    return 'android';
                } else if (/iPhone|iPad|iPod/i.test(userAgent)) {
                    return 'ios';
                }
            }
            
            return 'unknown';
        }

        // 更新状态显示
        function updateStatus(text, isDetecting = false) {
            const statusEl = document.getElementById('status');
            const statusTextEl = document.getElementById('statusText');
            
            statusTextEl.textContent = text;
            
            if (isDetecting) {
                statusEl.classList.add('detecting');
            } else {
                statusEl.classList.remove('detecting');
            }
        }

        // 自动跳转
        function autoRedirect(device) {
            let countdown = Math.floor(CONFIG.autoRedirectDelay / 1000);
            
            const countdownInterval = setInterval(() => {
                if (countdown > 0) {
                    if (device === 'ios') {
                        updateStatus(`检测到 iOS 设备，${countdown} 秒后跳转到 App Store...`, true);
                    } else if (device === 'android') {
                        updateStatus(`检测到 Android 设备，${countdown} 秒后跳转到下载页面...`, true);
                    }
                    countdown--;
                } else {
                    clearInterval(countdownInterval);
                }
            }, 1000);

            setTimeout(() => {
                if (device === 'ios') {
                    updateStatus('正在跳转到 App Store...', true);
                    // 尝试跳转，如果失败则使用备用链接
                    try {
                        window.location.href = CONFIG.iosUrl;
                    } catch (e) {
                        console.log('主链接跳转失败，尝试备用链接');
                        window.location.href = CONFIG.iosUrlFallback;
                    }
                } else if (device === 'android') {
                    updateStatus('正在跳转到下载页面...', true);
                    window.location.href = CONFIG.androidUrl;
                }
            }, CONFIG.autoRedirectDelay);
        }

        // 页面加载完成后执行
        window.addEventListener('DOMContentLoaded', function() {
            const device = detectDevice();
            
            if (device === 'ios') {
                updateStatus('检测到 iOS 设备', false);
                autoRedirect('ios');
            } else if (device === 'android') {
                updateStatus('检测到 Android 设备', false);
                autoRedirect('android');
            } else {
                updateStatus('未能识别设备类型，请手动选择下载方式', false);
            }
        });

        // 按钮点击事件（用于统计或其他逻辑）
        document.getElementById('iosBtn').addEventListener('click', function(e) {
            console.log('用户点击了 iOS 按钮');
            // 这里可以添加统计代码
        });

        document.getElementById('androidBtn').addEventListener('click', function(e) {
            console.log('用户点击了 Android 按钮');
            // 这里可以添加统计代码
        });
    </script>
</body>
</html>
